<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI Document Manager</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>


<body>

    <header>

        <div class="header-content">

            <h1>AI Document Manager</h1>

            <p>
                Gestisci, analizza e interroga
                i tuoi documenti.
            </p>

        </div>

    </header>


    <main>

        <!-- =========================
             UPLOAD
        ========================== -->

        <section class="card">

            <h2>Carica documento</h2>

            <p class="section-description">
                Seleziona un file PDF da aggiungere
                al Document Manager.
            </p>


            <div class="upload-area">

                <input
                    type="file"
                    id="fileInput"
                    accept=".pdf"
                >

                <button
                    id="uploadButton"
                    type="button"
                >
                    Carica PDF
                </button>

            </div>


            <p
                id="uploadStatus"
                class="upload-status"
            ></p>

        </section>


        <!-- =========================
             DOCUMENTI
        ========================== -->

        <section class="card">

            <div class="documents-header">

    <div>
        <h2>I miei documenti</h2>

        <p class="section-description">
            Documenti presenti nel sistema.
        </p>
    </div>

    <span
        id="documentCount"
        class="document-count"
    >
        0 documenti
    </span>

</div>

<div class="search-area">

    <input
        type="text"
        id="searchInput"
        placeholder="Cerca documento..."
    >

</div>
            <div id="documentsList">

                <!--
                    I documenti vengono inseriti
                    dinamicamente tramite JavaScript.
                -->

            </div>

        </section>

    </main>


    <script src="/static/app.js"></script>

</body>

</html>
